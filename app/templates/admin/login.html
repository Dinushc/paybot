{% extends "admin/base.html" %}
{% block title %}Login · PayBot admin{% endblock %}
{% block content %}
<h2>Admin login</h2>
<p class="muted">Paste an admin API token (ADMIN_API_TOKEN or a key created via the admin API).</p>
<form method="post" action="/admin/login">
  <p><label>Admin token</label><input type="password" name="token" size="50" autofocus required></p>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
