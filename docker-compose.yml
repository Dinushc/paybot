services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paybot
      POSTGRES_USER: paybot
      POSTGRES_PASSWORD: paybot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paybot -d paybot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &env
      DATABASE_URL: postgresql+psycopg://paybot:paybot@db:5432/paybot
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_AUTO_SETUP: "0"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      AUTO_CREATE_TABLES: "0"
      WORKERS_ENABLED: "0"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *env
      TELEGRAM_AUTO_SETUP: ${TELEGRAM_AUTO_SETUP:-1}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *env
      TELEGRAM_AUTO_SETUP: "0"
      WORKERS_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
